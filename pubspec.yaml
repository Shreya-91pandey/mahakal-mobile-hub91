name: mahakal_mobile_hub
description: Professional Mobile Shop E-commerce App - Mahakal Mobile Hub (Indore)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.19.0
  image_picker: ^1.0.7
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
